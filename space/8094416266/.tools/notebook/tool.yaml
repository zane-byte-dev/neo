name: notebook
description: |
  操作文件系统知识库（{workDir}/notebooks/）。
  • action=notebooks — 列出所有 notebook 名称
  • action=list      — 列出条目（可按 notebook 筛选）
  • action=search    — 全文搜索
  • action=read      — 按 id 或标题关键词读取完整内容
  • action=add       — 新增条目（必须指定 notebook）
  • action=update    — 更新条目（按 id）
  • action=delete    — 删除条目（按 id）

parameters:
  action:
    type: string
    description: '操作类型: notebooks, list, search, read, add, update, delete'
    required: true
  notebook:
    type: string
    description: '[list/search/add] notebook 名称，如 "xifeng"、"personal"'
  query:
    type: string
    description: '[search] 搜索关键词'
  id:
    type: string
    description: '[read/update/delete] 条目 ID，格式 "notebook/filename.md"'
  title_query:
    type: string
    description: '[read] 按标题关键词查找（模糊匹配，id 优先）'
  title:
    type: string
    description: '[add/update] 标题'
  author:
    type: string
    description: '[add/update] 作者'
  date:
    type: string
    description: '[add/update] 日期，如 "2024-03-09"'
  source:
    type: string
    description: '[add/update] 来源'
  summary:
    type: string
    description: '[add/update] 摘要/核心观点'
  tags:
    type: string
    description: '[add/update] 逗号分隔的标签'
  content:
    type: string
    description: '[add/update] 正文内容'
  limit:
    type: number
    description: '[list/search] 返回最大条数（默认 50）'

timeout: 15000
